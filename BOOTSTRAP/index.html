<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="container mt-5">
    <div class="row text-center">
      
      <!-- Burger -->
      <div class="col-sm-4">
        <img src="https://png.pngtree.com/png-clipart/20241108/original/pngtree-delicious-and-testy-cheese-burger-png-image_16763714.png"
             style="width:250px; height:200px;" alt="Burger">
        <h5 class="mt-2">Burger</h5>
        <p class="text-success">Price: ₹120</p>
      </div>

      <!-- Pizza -->
      <div class="col-sm-4">
        <img src="https://png.pngtree.com/png-vector/20241211/ourmid/pngtree-authentic-italian-pizza-with-cheese-and-fresh-vegetable-toppings-png-image_14714611.png"
             style="width:250px; height:200px;" alt="Pizza">
        <h5 class="mt-2">Pizza</h5>
        <p class="text-success">Price: ₹250</p>
      </div>

      <!-- Coke -->
      <div class="col-sm-4">
        <img src="https://png.pngtree.com/png-clipart/20231116/original/pngtree-coca-cola-bottled-drink-isolated-photo-png-image_13575918.png"
        style="height:200px; width:auto;" alt="Coke">
        <h5 class="mt-2">Coke</h5>
        <p class="text-success">Price: ₹25</p>
      </div>

    </div>
  </div>
</body>
</html>
