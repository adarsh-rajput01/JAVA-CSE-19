<!DOCTYPE html> 
<html lang="en"> 
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="bg-gray-100">

 </header>

        <h2 class="text-3xl md:text-5xl font-bold mb-4">

        </h2> 
        <p class="text-lg md:text-xl mb-6">
